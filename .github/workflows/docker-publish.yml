# Goal: Verify that the Docker image builds successfully in the CI pipeline without pushing.

name: Day 45 - Docker build and publish

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-push:
        name: Build Docker Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository code 
              uses: actions/checkout@v7

            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (Test only)
              uses: docker/build-push-action@v5
              with:
                context: .
                push: false
                tags: my-ecommerce-app:test
