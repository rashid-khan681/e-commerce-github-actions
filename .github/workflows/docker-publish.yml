# GOAL: Build images on all branches to test them, but ONLY push to Docker Hub if the branch is 'main'.

name: Day 45 - Docker build and publish

on:
   # push:
        
    workflow_dispatch:

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository code 
              uses: actions/checkout@v7

            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Get short commit SHA
              id: vars
              run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                context: .
                push: ${{ github.ref == 'refs/heads/main' }}
                tags: |
                  ${{ secrets.DOCKER_USERNAME }}/my-ecommerce-app:latest
                  ${{ secrets.DOCKER_USERNAME }}/my-ecommerce-app:sha-${{ env.SHORT_SHA }}
