# Goal: A reusable workflow to standardize the build process across multiple repositories.

name: Reusable build workflow

on:
    workflow_call:
        inputs:
            app_name:
                description: 'Name of the Application'
                required: true
                type: string
            environment:
                description: 'Deploymnet environment'
                required: true 
                default: 'staging'
                type: string 
        secrets:
            docker_token:
                description: 'Docker Hub token'
                required: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: print build details
              run: |
                echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}"

            - name: Verify secret presence 
              run: |
                # Check if secret exists without printing its actual value
                if [ -n "${{ secrets.docker_token }}" ]; then
                  echo "Docker token is set: true"
                else:
                  echo "Docker token is set: false"
                fi