# Goal: A caller workflow that triggers on a push to the main branch.

name: Call reusable workflow

on:
    push:
        branches:
            - main

jobs:
    call-reusable-build:
        uses: ./.github/workflows/reusable-build.yml
        with:
            app_name: "my-web-app"
            environment: "production"
        secrets:
            docker_token: ${{ secrets.DOCKER_TOKEN }}
            